plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
}

version = '1.0.0'
group = 'com.example.SeverCommandGrant'

base {
    archivesName = 'SeverCommandGrant'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings {
        official(minecraft_version)
    }
}

repositories {
    mavenLocal()
    maven {
        name = 'NeoForgedMirror'
        url = 'https://bmclapi2.bangbang93.com/maven'
    }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'    : 'SeverCommandGrant',
            'Specification-Vendor'   : 'ChenBB',
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : 'ChenBB'
        ])
    }
}
